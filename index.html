<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile E-sports Reflex Game</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
}
#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}
#top {
    height: 62px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
}
.stat { text-align: center; min-width: 25%; }
.label { font-size: 11px; color: #aaa; }
.value { font-size: 21px; font-weight: bold; margin-top: 2px; }
#game {
    position: relative;
    flex: 1;
    margin: 10px;
    border: 2px solid #333;
    border-radius: 16px;
    overflow: hidden;
    background:
      radial-gradient(circle at center, #1b1b1b 0%, #0b0b0b 65%);
}
#target {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: red;
    border: 4px solid white;
    box-shadow: 0 0 12px red, 0 0 30px rgba(255,0,0,.45);
    transform: translate(-50%, -50%);
    display: none;
}
#target:active { transform: translate(-50%, -50%) scale(.9); }
#message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: auto;
}
.card {
    background: rgba(0,0,0,.78);
    border: 1px solid #444;
    border-radius: 18px;
    padding: 24px;
    width: min(90%, 390px);
}
.card h1 { margin: 0 0 12px; font-size: 25px; }
.card p { color: #ccc; line-height: 1.6; }
button {
    border: 0;
    border-radius: 12px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    background: #1683ff;
    color: white;
}
button:active { transform: scale(.97); }
#result { display: none; }
#hint {
    height: 36px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #aaa;
    font-size: 12px;
    flex-shrink: 0;
}
.green { color: #00ff66; }
.yellow { color: #00ffff; }
.orange { color: #ff8c00; }
</style>
</head>

<body>
<div id="app">
    <div id="top">
        <div class="stat">
            <div class="label">TIME</div>
            <div id="time" class="value yellow">20</div>
        </div>
        <div class="stat">
            <div class="label">SCORE</div>
            <div id="score" class="value green">0</div>
        </div>
        <div class="stat">
            <div class="label">REACTION</div>
            <div id="reaction" class="value">0.00s</div>
        </div>
        <div class="stat">
            <div class="label">LEVEL</div>
            <div id="level" class="value orange">BEGINNER</div>
        </div>
    </div>

    <div id="game">
        <div id="target"></div>

        <div id="message">
            <div id="startCard" class="card">
                <h1>REFLEX GAME</h1>
                <p>
                    赤いターゲットが表示されたら<br>
                    できるだけ早くタップしてください。<br>
                    制限時間は20秒です。
                </p>
                <button id="startButton">START</button>
            </div>

            <div id="result" class="card">
                <h1>RESULT</h1>
                <p>SCORE</p>
                <div id="finalScore" style="font-size:36px;font-weight:bold;color:#00ff66;">0</div>
                <p>AVERAGE REACTION</p>
                <div id="finalAvg" style="font-size:30px;color:#00ffff;">0.00s</div>
                <p>LEVEL</p>
                <div id="finalLevel" style="font-size:28px;color:#ff8c00;">BEGINNER</div>
                <br>
                <button id="restartButton">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <div id="hint">ターゲットをできるだけ速くタップ</div>
</div>

<script>
const GAME_DURATION = 20;
const target = document.getElementById("target");
const gameArea = document.getElementById("game");

const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const reactionEl = document.getElementById("reaction");
const levelEl = document.getElementById("level");

const startCard = document.getElementById("startCard");
const resultCard = document.getElementById("result");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const finalScore = document.getElementById("finalScore");
const finalAvg = document.getElementById("finalAvg");
const finalLevel = document.getElementById("finalLevel");

let score = 0;
let reactionTimes = [];
let startTime = 0;
let spawnTime = 0;
let gameRunning = false;
let timerId = null;

function averageReaction() {
    if (reactionTimes.length === 0) return 0;
    return reactionTimes.reduce((a,b) => a+b, 0) / reactionTimes.length;
}

function getLevel() {
    if (reactionTimes.length === 0) return "BEGINNER";

    const avg = averageReaction();

    if (avg < 0.30) return "PRO";
    if (avg < 0.55) return "INTERMEDIATE";
    return "BEGINNER";
}

function updateUI() {
    scoreEl.textContent = score;

    const avg = averageReaction();
    reactionEl.textContent = avg.toFixed(2) + "s";

    const level = getLevel();
    levelEl.textContent = level;

    const remain = Math.max(
        0,
        Math.ceil(GAME_DURATION - (performance.now() - startTime) / 1000)
    );
    timeEl.textContent = remain;
}

function generateTarget() {
    const rect = gameArea.getBoundingClientRect();

    const margin = 45;
    const x = margin + Math.random() * (rect.width - margin * 2);
    const y = margin + Math.random() * (rect.height - margin * 2);

    target.style.left = x + "px";
    target.style.top = y + "px";
    target.style.display = "block";

    spawnTime = performance.now();
}

function startGame() {
    score = 0;
    reactionTimes = [];
    startTime = performance.now();
    gameRunning = true;

    startCard.style.display = "none";
    resultCard.style.display = "none";

    updateUI();
    generateTarget();

    clearInterval(timerId);
    timerId = setInterval(() => {
        updateUI();

        if (performance.now() - startTime >= GAME_DURATION * 1000) {
            endGame();
        }
    }, 50);
}

function hitTarget() {
    if (!gameRunning) return;

    const reaction = (performance.now() - spawnTime) / 1000;

    reactionTimes.push(reaction);
    score++;

    updateUI();
    generateTarget();
}

function endGame() {
    if (!gameRunning) return;

    gameRunning = false;
    clearInterval(timerId);
    target.style.display = "none";

    const avg = averageReaction();
    const level = getLevel();

    timeEl.textContent = "0";
    finalScore.textContent = score;
    finalAvg.textContent = avg.toFixed(2) + "s";
    finalLevel.textContent = level;

    resultCard.style.display = "block";
}

target.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    hitTarget();
});

startButton.addEventListener("pointerdown", (e) => { e.preventDefault(); startGame(); });
restartButton.addEventListener("pointerdown", (e) => { e.preventDefault(); startGame(); });

updateUI();
</script>
</body>
</html>
